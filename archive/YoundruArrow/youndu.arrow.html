<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>arrow test</title>
<style>
  html, body { margin: 0; padding: 0; background: #0b0a09; }
  body { overflow-x: clip; }
  #stage { position: fixed; inset: 0; width: 100vw; height: 100vh; display: block; z-index: 0; }
  /* hero-chapter: panels are sticky-pinned while this range scrolls by, then release
     into normal flow and scroll away with it, freeing the screen for what comes next. */
  .hero-chapter { position: relative; height: 150vh; z-index: 1; pointer-events: none; }
  .rest-space { height: 250vh; }

  .panel {
    position: sticky;
    opacity: 0;
    --glow: 0;
    background: linear-gradient(180deg, rgba(28,26,24,0.92), rgba(15,14,13,0.92));
    border: 1px solid rgba(230,83,50, calc(0.09 + var(--glow) * 0.65));
    border-radius: 14px;
    padding: 14px 16px 16px;
    color: #e9e3d8;
    font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
    font-size: 12.5px;
    line-height: 1.65;
    box-shadow: 0 20px 50px rgba(0,0,0,0.55), 0 0 calc(8px + 46px * var(--glow)) rgba(230,83,50, calc(var(--glow) * 0.85));
    pointer-events: none;
  }
  .panel__head { display:flex; align-items:center; gap:6px; margin-bottom:10px; }
  .dot { width:9px; height:9px; border-radius:50%; }
  .dot.r{ background:#ff5f57; } .dot.y{ background:#febc2e; } .dot.g{ background:#28c840; }
  .panel__name{ margin-left:6px; font-size:11px; color:#948d81; letter-spacing:.03em; }

  /* position:sticky resolves left/right as relative-style offsets from its own
     static flow position (block start, i.e. the left edge), NOT from the
     containing block's edge the way fixed/absolute do -- so horizontal
     placement here uses margin-left:auto (pushes the box fully right within
     its container) + margin-right for the exact gap, instead of `right`. */
  .panel { margin-left: auto; }

  /* top: BIG in width AND height, furthest-back layer. Together the three
     panels span most of the viewport height, not just a corner cluster. */
  .code-panel{ top:4vh; margin-right:3vw; width:min(880px, 60vw); z-index:2;
    font-size: 18px; padding: 26px 30px 34px;
    transform: perspective(1200px) rotateX(6deg) rotateY(-12deg) rotateZ(-2deg); }
  /* middle: SMALL, sits in front of the code panel's corner */
  .api-panel{ top:37vh; margin-right:40vw; width:min(190px, 16vw); z-index:3;
    transform: perspective(1000px) rotateX(-4deg) rotateY(9deg) rotateZ(3deg); }
  /* rightmost: MEDIUM, front-most layer -- overlaps both of the others */
  .events-panel{ top:47vh; margin-right:4vw; width:min(460px, 38vw); z-index:4;
    font-size: 15px; padding: 22px 26px 28px;
    transform: perspective(1000px) rotateX(3deg) rotateY(-8deg) rotateZ(4deg); }

  .code .ln{ display:inline-block; width:14px; color:#5c564c; }
  .code .kw{ color:#ff8f5e; }
  .code .fn{ color:#ffd479; }
  .code div{ white-space:pre; }

  .rows .row{ display:flex; gap:8px; padding:5px 0; border-top:1px solid rgba(255,255,255,0.06); }
  .rows .row:first-child{ border-top:none; }
  .method{ font-size:10.5px; font-weight:700; width:36px; }
  .method.get{ color:#7dd3fc; }
  .method.post{ color:#fbbf24; }
  .path, .evt{ color:#cfc8ba; }
  .evt::before{ content:"•"; color:#e65332; margin-right:6px; }
</style>
</head>
<body>
<canvas id="stage"></canvas>

<div class="hero-chapter">
  <div class="panel code-panel" id="panelCode">
    <div class="panel__head"><span class="dot r"></span><span class="dot y"></span><span class="dot g"></span><span class="panel__name">connect.js</span></div>
    <div class="code">
      <div><span class="ln">1</span><span class="kw">async function</span> <span class="fn">connect</span>() {</div>
      <div><span class="ln">2</span>&nbsp;&nbsp;<span class="kw">const</span> data = <span class="kw">await</span> source.<span class="fn">read</span>();</div>
      <div><span class="ln">3</span>&nbsp;&nbsp;<span class="kw">return</span> target.<span class="fn">sync</span>(data);</div>
      <div><span class="ln">4</span>}</div>
    </div>
  </div>

  <div class="panel api-panel" id="panelApi">
    <div class="panel__head"><span class="panel__name">API</span></div>
    <div class="rows">
      <div class="row"><span class="method get">GET</span><span class="path">/users</span></div>
      <div class="row"><span class="method post">POST</span><span class="path">/sync</span></div>
      <div class="row"><span class="method get">GET</span><span class="path">/integrations</span></div>
    </div>
  </div>

  <div class="panel events-panel" id="panelEvents">
    <div class="panel__head"><span class="panel__name">EVENTS</span></div>
    <div class="rows">
      <div class="row"><span class="evt">user.created</span></div>
      <div class="row"><span class="evt">data.synced</span></div>
      <div class="row"><span class="evt">integration.completed</span></div>
      <div class="row"><span class="evt">workflow.triggered</span></div>
    </div>
  </div>
</div>

<div class="rest-space"></div>

<script type="module">
import * as THREE from 'three';

/* ---------- renderer / scene / camera ---------- */

const canvas = document.getElementById('stage');
const renderer = new THREE.WebGLRenderer({ canvas, antialias: true, alpha: false });
renderer.setPixelRatio(Math.min(window.devicePixelRatio || 1, 2));
renderer.outputColorSpace = THREE.SRGBColorSpace;

const scene = new THREE.Scene();
scene.background = new THREE.Color(0x0b0a09);

const camera = new THREE.PerspectiveCamera(50, innerWidth / innerHeight, 0.1, 100);

function resize() {
  renderer.setSize(innerWidth, innerHeight);
  camera.aspect = innerWidth / innerHeight;
  camera.updateProjectionMatrix();
}
window.addEventListener('resize', resize);
resize();

scene.add(new THREE.AmbientLight(0x4a4038, 1.2));
const key = new THREE.DirectionalLight(0xfff2e0, 1.3);
key.position.set(3, 4, 5);
scene.add(key);

/* ---------- flight path ----------
   ONE continuous scroll-driven path, no autoplay. It never moves on its own.
   Phase 1 (0 -> HERO_SHARE of scroll progress): rest pose -> touches connect.js
   -> API -> Events, in that order.
   Phase 2 (HERO_SHARE -> 1): continues on into the rest of the (currently empty) page.
*/

const HERO_SHARE = 0.4;
const SHRINK_END = 0.05;
const PANEL_FADE_START = 0.05;
const PANEL_FADE_END = 0.1;
const HOLD_END = 0.1;

function progressToT(p) {
  if (p <= HOLD_END) return 0;
  if (p <= HERO_SHARE) return HERO_SHARE * (p - HOLD_END) / (HERO_SHARE - HOLD_END);
  return p;
}

const restPoint = new THREE.Vector3(0.9, 0.9, 0.1);
const codeTouch = new THREE.Vector3(2.0, 1.0, -0.1);
const apiTouch = new THREE.Vector3(0.9, -0.75, 0.15);
const eventsTouch = new THREE.Vector3(2.1, -0.85, -0.15);

const heroCurve = new THREE.CatmullRomCurve3([
  restPoint,
  codeTouch,
  new THREE.Vector3(2.35, 0.05, 0.25),
  apiTouch,
  eventsTouch,
], false, 'catmullrom', 0.55);

const restCurve = new THREE.CatmullRomCurve3([
  eventsTouch,
  new THREE.Vector3(1.0, -2.6, -0.8),
  new THREE.Vector3(-1.6, -5.0, 0.6),
  new THREE.Vector3(1.7, -7.6, -0.9),
  new THREE.Vector3(-1.1, -10.2, 1.0),
  new THREE.Vector3(1.0, -12.8, -0.6),
  new THREE.Vector3(0, -15.2, 0),
], false, 'catmullrom', 0.55);

function journeyPoint(t) {
  if (t <= HERO_SHARE) return heroCurve.getPointAt(Math.min(t / HERO_SHARE, 1));
  return restCurve.getPointAt(Math.min((t - HERO_SHARE) / (1 - HERO_SHARE), 1));
}
function journeyTangent(t) {
  if (t <= HERO_SHARE) return heroCurve.getTangentAt(Math.min(t / HERO_SHARE, 1)).normalize();
  return restCurve.getTangentAt(Math.min((t - HERO_SHARE) / (1 - HERO_SHARE), 1)).normalize();
}

const SAMPLE_COUNT = 400;
const N_HERO = Math.round(SAMPLE_COUNT * HERO_SHARE);
const N_REST = SAMPLE_COUNT - N_HERO;
const pathSamples = heroCurve.getSpacedPoints(N_HERO).concat(restCurve.getSpacedPoints(N_REST).slice(1));

const panelDefs = [
  { el: document.getElementById('panelCode'), touch: codeTouch, glow: 0, activated: false },
  { el: document.getElementById('panelApi'), touch: apiTouch, glow: 0, activated: false },
  { el: document.getElementById('panelEvents'), touch: eventsTouch, glow: 0, activated: false },
];

/* ---------- arrow group ---------- */

const SHAFT_LEN = 2.2;
const SHAFT_R = 0.05;

const arrow = new THREE.Group();

const shaftMat = new THREE.MeshStandardMaterial({
  color: 0xede3d3, metalness: 0.55, roughness: 0.35,
  emissive: 0x2a1208, emissiveIntensity: 0.4,
});
const shaft = new THREE.Mesh(new THREE.CylinderGeometry(SHAFT_R, SHAFT_R, SHAFT_LEN, 16), shaftMat);
arrow.add(shaft);

const head = new THREE.Mesh(new THREE.ConeGeometry(0.14, 0.36, 20), shaftMat);
head.position.y = SHAFT_LEN / 2 + 0.18;
arrow.add(head);

const finMat = new THREE.MeshStandardMaterial({
  color: 0xe65332, metalness: 0.2, roughness: 0.4,
  emissive: 0xe65332, emissiveIntensity: 0.9, side: THREE.DoubleSide,
});
const finShape = new THREE.Shape();
finShape.moveTo(0, 0);
finShape.lineTo(0.26, -0.32);
finShape.lineTo(0, -0.5);
finShape.lineTo(-0.04, -0.18);
finShape.closePath();
const finGeo = new THREE.ExtrudeGeometry(finShape, { depth: 0.02, bevelEnabled: false });
const finPivot = new THREE.Group();
finPivot.position.y = -SHAFT_LEN / 2;
for (let i = 0; i < 3; i++) {
  const fin = new THREE.Mesh(finGeo, finMat);
  fin.rotation.y = (i / 3) * Math.PI * 2;
  finPivot.add(fin);
}
arrow.add(finPivot);

/* name plate, running along the shaft */
function makeNameTexture(text) {
  const label = text.toUpperCase();
  const c = document.createElement('canvas');
  c.width = 320; c.height = 2048;
  const ctx = c.getContext('2d');
  const targetSpan = c.height * 0.94;
  let fontSize = 300;
  ctx.font = `700 ${fontSize}px Arial, sans-serif`;
  const measured = ctx.measureText(label).width;
  if (measured > targetSpan) fontSize *= targetSpan / measured;
  ctx.font = `700 ${fontSize}px Arial, sans-serif`;
  ctx.translate(c.width / 2, c.height / 2);
  ctx.rotate(-Math.PI / 2);
  ctx.textAlign = 'center';
  ctx.textBaseline = 'middle';
  ctx.shadowColor = '#ff7a3d';
  ctx.shadowBlur = 60;
  ctx.fillStyle = '#ffddb0';
  ctx.fillText(label, 0, 0);
  ctx.shadowBlur = 12;
  ctx.fillStyle = '#fff6ec';
  ctx.fillText(label, 0, 0);
  const tex = new THREE.CanvasTexture(c);
  tex.needsUpdate = true;
  return tex;
}
const nameTex = makeNameTexture('SACHAYANTHAN');
const namePlate = new THREE.Mesh(
  new THREE.PlaneGeometry(0.34, SHAFT_LEN * 0.88),
  new THREE.MeshBasicMaterial({ map: nameTex, transparent: true, opacity: 1, depthWrite: false, side: THREE.DoubleSide })
);
namePlate.position.set(0, 0, SHAFT_R + 0.015);
arrow.add(namePlate);

const glowLight = new THREE.PointLight(0xff6a35, 1.6, 5, 2);
glowLight.position.set(0, -SHAFT_LEN / 2, 0.2);
arrow.add(glowLight);

scene.add(arrow);

/* ---------- persistent path trail (tube) ---------- */

let trailTube = null;
let lastReveal = -1;

function rebuildTrail(revealCount) {
  if (revealCount < 2) revealCount = 2;
  const pts = pathSamples.slice(0, revealCount);
  const subCurve = new THREE.CatmullRomCurve3(pts);

  if (trailTube) { scene.remove(trailTube); trailTube.geometry.dispose(); }

  const segs = Math.max(revealCount - 1, 1);
  trailTube = new THREE.Mesh(
    new THREE.TubeGeometry(subCurve, segs, 0.018, 8, false),
    new THREE.MeshBasicMaterial({ color: 0xff5e2b })
  );
  scene.add(trailTube);
}
rebuildTrail(2);

/* ---------- falling-star tail particles ---------- */

function makeGlowTexture() {
  const size = 128;
  const c = document.createElement('canvas');
  c.width = c.height = size;
  const ctx = c.getContext('2d');
  const g = ctx.createRadialGradient(size / 2, size / 2, 0, size / 2, size / 2, size / 2);
  g.addColorStop(0, 'rgba(255,240,220,1)');
  g.addColorStop(0.25, 'rgba(255,170,110,0.9)');
  g.addColorStop(0.6, 'rgba(230,83,50,0.35)');
  g.addColorStop(1, 'rgba(230,83,50,0)');
  ctx.fillStyle = g;
  ctx.fillRect(0, 0, size, size);
  return new THREE.CanvasTexture(c);
}
const glowTex = makeGlowTexture();

const POOL_SIZE = 90;
const particles = [];
for (let i = 0; i < POOL_SIZE; i++) {
  const sprite = new THREE.Sprite(new THREE.SpriteMaterial({
    map: glowTex, color: 0xffb27a, transparent: true, opacity: 0,
    blending: THREE.AdditiveBlending, depthWrite: false,
  }));
  sprite.scale.setScalar(0.001);
  scene.add(sprite);
  particles.push({ mesh: sprite, life: 0, maxLife: 1, vel: new THREE.Vector3() });
}
let spawnCursor = 0;
let spawnAccum = 0;

function spawnParticle(originWorld, backward) {
  const p = particles[spawnCursor];
  spawnCursor = (spawnCursor + 1) % POOL_SIZE;
  p.mesh.position.copy(originWorld);
  p.vel.copy(backward).multiplyScalar(0.6 + Math.random() * 0.5);
  p.vel.x += (Math.random() - 0.5) * 0.25;
  p.vel.y += (Math.random() - 0.5) * 0.25;
  p.vel.z += (Math.random() - 0.5) * 0.25;
  p.maxLife = 0.6 + Math.random() * 0.4;
  p.life = p.maxLife;
  p.baseScale = 0.14 + Math.random() * 0.08;
  p.mesh.material.opacity = 1;
}

/* ---------- scroll-driven progress (the ONLY thing that moves the arrow) ---------- */

let progress = 0;
let displayProgress = 0;
function maxScroll() {
  return Math.max(document.body.scrollHeight - innerHeight, 1);
}

let camY = 0;
let camX = 0;

const forwardAxis = new THREE.Vector3(0, 1, 0);
const clock = new THREE.Clock();

function animate() {
  requestAnimationFrame(animate);
  const dt = Math.min(clock.getDelta(), 0.05);
  const elapsed = clock.elapsedTime;

  progress = Math.min(Math.max(window.scrollY / maxScroll(), 0), 1);
  displayProgress += (progress - displayProgress) * 0.09;

  const t = progressToT(displayProgress);
  const pos = journeyPoint(t);
  const tangent = journeyTangent(t);

  const bob = Math.sin(elapsed * 1.6) * 0.06 * (1 - displayProgress * 0.6);
  arrow.position.copy(pos);
  arrow.position.y += bob;

  const quat = new THREE.Quaternion().setFromUnitVectors(forwardAxis, tangent);
  const wobble = new THREE.Quaternion().setFromAxisAngle(new THREE.Vector3(0, 0, 1), Math.sin(elapsed * 1.1) * 0.05);
  arrow.quaternion.copy(quat).multiply(wobble);

  const scale = THREE.MathUtils.lerp(1.5, 0.5, Math.min(displayProgress / SHRINK_END, 1));
  arrow.scale.setScalar(scale);
  namePlate.material.opacity = 1 - Math.min(displayProgress / SHRINK_END, 1);

  const panelReveal = Math.max(0, Math.min(1, (displayProgress - PANEL_FADE_START) / (PANEL_FADE_END - PANEL_FADE_START)));
  for (const panel of panelDefs) panel.el.style.opacity = panelReveal.toFixed(3);

  const revealCount = Math.min(Math.max(Math.floor(t * SAMPLE_COUNT) + 2, 2), SAMPLE_COUNT + 1);
  if (revealCount !== lastReveal) {
    rebuildTrail(revealCount);
    lastReveal = revealCount;
  }

  spawnAccum += dt;
  const tailOffset = new THREE.Vector3(0, -SHAFT_LEN / 2 - 0.15, 0).applyQuaternion(arrow.quaternion).multiplyScalar(scale);
  const tailWorld = arrow.position.clone().add(tailOffset);
  const backward = tangent.clone().multiplyScalar(-1);
  while (spawnAccum > 0.02) {
    spawnAccum -= 0.02;
    spawnParticle(tailWorld, backward);
  }
  for (const p of particles) {
    if (p.life <= 0) continue;
    p.life -= dt;
    p.mesh.position.addScaledVector(p.vel, dt);
    const t = Math.max(p.life / p.maxLife, 0);
    p.mesh.material.opacity = t;
    p.mesh.scale.setScalar(p.baseScale * (0.5 + t * 0.7));
    if (p.life <= 0) p.mesh.material.opacity = 0;
  }

  for (const panel of panelDefs) {
    const dist = arrow.position.distanceTo(panel.touch);
    let proximity = Math.max(0, 1 - dist / 0.85);
    proximity *= proximity;
    if (proximity > 0.55) panel.activated = true;
    const target = panel.activated ? 1 : proximity;
    panel.glow += (target - panel.glow) * 0.25;
    panel.el.style.setProperty('--glow', panel.glow.toFixed(3));
  }

  camY += (pos.y - camY) * 0.05;
  camX += (pos.x * 0.4 - camX) * 0.05;
  camera.position.set(camX, camY + 0.15, 5.6);
  camera.lookAt(camX, camY, 0);

  renderer.render(scene, camera);
}
animate();
</script>
</body>
</html>
